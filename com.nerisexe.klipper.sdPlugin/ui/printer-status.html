<!DOCTYPE html>
<html>

<head lang="en">
    <title>Printer Status Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <!--
        Learn more about property inspector components at https://sdpi-components.dev/docs/components
    -->
    <sdpi-item label="Moonraker API URL">
        <sdpi-textfield setting="moonrakerUrl" placeholder="http://192.168.1.3:7125/" required></sdpi-textfield>
        <span>See your moonraker.conf for port the number.</span>
    </sdpi-item>
    <sdpi-item label="Update interval (seconds)">
        <sdpi-range setting="updateInterval" min="0" max="600" step="10" default="60" showlabels></sdpi-range>
        <span>Set to 0 to disable auto update.</span>
    </sdpi-item>

    <br/>

    <sdpi-item label="Details line 1 (while printing)">
        <sdpi-checkbox-list setting="detailsLine1Data" columns="2" value-type="string">
            <option value="layers">Layer info</option>
            <option value="printTime">Print time</option>
            <option value="filename">Filename</option>
            <option value="statusMessage">Status message</option>
            <option value="displayMessage">Display message</option>
        </sdpi-checkbox-list>
    </sdpi-item>
    <sdpi-item label="Details line 2 (while printing)">
        <sdpi-checkbox-list setting="detailsLine2Data" columns="2" value-type="string">
            <option value="layers">Layer info</option>
            <option value="printTime">Print time</option>
            <option value="filename">Filename</option>
            <option value="statusMessage">Status message</option>
            <option value="displayMessage">Display message</option>
        </sdpi-checkbox-list>
    </sdpi-item>

    <br/>

    <sdpi-item label="When the key pressed">
        <sdpi-select setting="keyAction">
            <option value="update">Update information</option>
            <option value="openUrl">Open URL</option>
            <option value="gcode">Execute GCODE</option>
        </sdpi-select>
    </sdpi-item>
    <sdpi-item label="URL to open">
        <sdpi-textfield setting="keyActionUrl" placeholder="http://192.168.1.3/"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="GCODE">
        <sdpi-textfield setting="gcode" placeholder="M117 Test message"></sdpi-textfield>
    </sdpi-item>

    <br/>

    <sdpi-item label="Icon style">
        <sdpi-select setting="iconStyle">
            <option value="voron">Voron</option>
            <option value="vzbot">VzBoT</option>
            <option value="klipper">Klipper</option>
            <option value="mainsail">Mainsail</option>
            <option value="fluidd">Fluidd</option>
            <option value="solid">Solid Color</option>
            <option value="blank">Blank</option>
        </sdpi-select>
    </sdpi-item>
    <sdpi-item>
        <sdpi-checkbox setting="showProgressbar" label="Show progressbar."></sdpi-checkbox>
    </sdpi-item>
    <sdpi-item label="Standby color">
        <sdpi-color setting="standbyColor" default="#3d005b"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Printing color">
        <sdpi-color setting="printingColor" default="#7c00ba"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Paused color">
        <sdpi-color setting="pausedColor" default="#bd880d"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Complete color">
        <sdpi-color setting="completeColor" default="#20bd0f"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Error color">
        <sdpi-color setting="errorColor" default="#ff0000"></sdpi-color>
    </sdpi-item>
</body>

</html>
